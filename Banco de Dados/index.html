<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Simulado interativo de Banco de Dados para testar seus conhecimentos">
  <title>Simulado Interativo | Banco de Dados</title>
  
  <!-- Favicon -->
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
  
  <!-- Pré-conexão para melhor performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- Fontes do Google -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
  
  <!-- Ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <h1 class="header__title">
        <i class="fas fa-database header__icon"></i>
        Simulado de Banco de Dados
      </h1>
      <p class="header__subtitle">Teste seus conhecimentos em conceitos fundamentais</p>
    </div>
  </header>

  <main class="main">
    <div class="container">
      <div class="quiz-info">
        <div class="quiz-progress">
          <span id="current-question">1</span> de <span id="total-questions">10</span> questões
          <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
        </div>
        <div class="quiz-timer">
          <i class="fas fa-clock"></i>
          <span id="timer">00:00</span>
        </div>
      </div>

      <div id="quiz-container" class="quiz-container"></div>

      <div class="quiz-actions">
        <button id="prev-btn" class="btn btn--secondary" disabled>
          <i class="fas fa-arrow-left"></i> Anterior
        </button>
        <button id="next-btn" class="btn btn--primary">
          Próxima <i class="fas fa-arrow-right"></i>
        </button>
        <button id="check-answers" class="btn btn--check" onclick="checkAnswers()">
          <i class="fas fa-check-circle"></i> Verificar Respostas
        </button>
      </div>
    </div>
  </main>

  <!-- Modal de Resultados -->
  <div id="result-modal" class="modal">
    <div class="modal__content">
      <span class="modal__close">&times;</span>
      <h2 class="modal__title">Seu Resultado</h2>
      <div class="modal__body" id="result-content"></div>
      <button id="restart-quiz" class="btn btn--primary">Refazer Simulado</button>
    </div>
  </div>

  <!-- JavaScript -->
  <script src="script.js" defer></script>
</body>
</html>
